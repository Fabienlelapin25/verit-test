<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verity Trainer — HUD Edition</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050508; --panel: #0d111a; --border: #2a3548; 
  --text: #d1d9e6; --dim: #667788; --accent: #00ffcc;
  --circle: #ffb347; --triangle: #ff6b6b; --square: #5ec4ff;
  --ok: #00ff88; --err: #ff4444; --warn: #ffaa00;
}
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: radial-gradient(circle at center, #111622 0%, #050508 100%);
  color: var(--text); min-height: 100vh; padding: 16px; font-size: 14px;
  overflow-x: hidden;
}

/* Toolbar */
.toolbar { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.btn {
  padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
  background: rgba(20, 30, 50, 0.6); color: var(--dim); cursor: pointer;
  font-size: 0.85em; transition: all 0.2s; font-family: inherit; text-transform: uppercase; letter-spacing: 1px;
}
.btn:hover { background: rgba(40, 60, 90, 0.8); color: white; }
.btn.active { background: rgba(0, 255, 204, 0.15); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,255,204,0.2); }

/* Grille des 3 salles */
.rooms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1300px; margin: 0 auto 20px; }
@media (max-width: 1000px) { .rooms-grid { grid-template-columns: 1fr; } }

/* HUD de la salle */
.room-hud {
  position: relative; aspect-ratio: 1/1; border-radius: 20px;
  background: radial-gradient(circle at center, #101520 0%, #05080d 100%);
  border: 2px solid var(--border);
  display: grid; 
  grid-template-rows: auto 1fr;
  padding: 20px; transition: all 0.3s; overflow: hidden;
}

/* Fond avec la grande forme */
.room-bg-shape {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 250px; opacity: 0.04; z-index: 0; pointer-events: none;
  line-height: 1;
}
.room-hud[data-room="circle"] .room-bg-shape { color: var(--circle); }
.room-hud[data-room="triangle"] .room-bg-shape { color: var(--triangle); }
.room-hud[data-room="square"] .room-bg-shape { color: var(--square); }

/* États de la salle */
/* SURVOL : Cyan (pour ne pas confondre avec la validation) */
.room-hud.active-player { border-color: var(--accent); box-shadow: inset 0 0 30px rgba(0, 255, 204, 0.1), 0 0 15px rgba(0, 255, 204, 0.2); }
.room-hud.doubled { border-color: #7a4a2a; }
/* VALIDATION : Vert */
.room-hud.solved { border-color: var(--ok); background: radial-gradient(circle at center, #0a1a12 0%, #05080d 100%); box-shadow: 0 0 20px rgba(0,255,136,0.3); }
.room-hud.over-capacity { border-color: var(--err); box-shadow: inset 0 0 30px rgba(255,68,68,0.1), 0 0 15px rgba(255,68,68,0.2); }

/* Badge RÉSOLUE */
.badge-solved {
  position: absolute; top: 10px; right: 10px; background: var(--ok); color: #000;
  padding: 4px 10px; border-radius: 10px; font-weight: bold; font-size: 0.7em;
  box-shadow: 0 0 10px var(--ok); z-index: 10; animation: pop 0.3s ease-out;
}
@keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Titres */
.hud-title { 
  font-size: 0.8em; color: var(--dim); text-transform: uppercase; 
  letter-spacing: 2px; margin-bottom: 12px; font-weight: bold; text-align: center;
  z-index: 2; position: relative; display: flex; justify-content: center; gap: 10px;
}
.wall-indicator { color: var(--warn); font-size: 0.9em; }

/* Zone du haut : Toutes les formes (Mur + Reçues) */
.forms-area { 
  z-index: 2; display: flex; flex-direction: column; align-items: center; 
  justify-content: flex-start; width: 100%; padding-top: 10px;
}
.forms-row { 
  display: flex; gap: 10px; justify-content: center; align-items: center; 
  flex-wrap: wrap; min-height: 50px; background: rgba(0,0,0,0.3); 
  padding: 15px; border-radius: 12px; width: 90%; border: 1px dashed rgba(255,255,255,0.1);
}

/* Zone du bas : Statues */
.statues-container {
  display: flex; flex-direction: row;
  justify-content: center; align-items: center;
  gap: 30px; z-index: 2;
  padding-bottom: 20px;
}

.statue {
  width: 75px; height: 75px; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
  background: rgba(20,30,50,0.9); transition: all 0.2s;
  position: relative; cursor: grab; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

/* Effet Arc de cercle */
.statue:nth-child(1) { transform: translateY(15px); }
.statue:nth-child(2) { transform: translateY(-15px); }
.statue:nth-child(3) { transform: translateY(15px); }

.statue.circle { color: var(--circle); border-color: rgba(255,179,71,0.5); }
.statue.triangle { color: var(--triangle); border-color: rgba(255,107,107,0.5); }
.statue.square { color: var(--square); border-color: rgba(94,196,255,0.5); }

.statue.drop-hover {
  transform: scale(1.15) translateY(0) !important; 
  box-shadow: 0 0 25px currentColor; background: rgba(255,255,255,0.15); border-color: currentColor; z-index: 10;
}

/* Textes des statues */
.statue-symbol { font-size: 2em; line-height: 1; }
.statue-dest { font-size: 0.6em; text-transform: uppercase; opacity: 0.8; margin-top: 4px; font-weight: bold; }
.statue-label { 
  position: absolute; bottom: -24px; font-size: 0.65em; 
  color: var(--dim); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
}

/* Formes (Drag & Drop) */
.form {
  width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  border-radius: 10px; font-size: 1.4em; cursor: grab; position: relative;
  transition: transform 0.15s, box-shadow 0.15s; border: 1px solid; user-select: none;
  background: rgba(0,0,0,0.8); z-index: 3;
}
.form:hover { transform: scale(1.15); z-index: 10; }
.form.circle { color: var(--circle); border-color: var(--circle); box-shadow: inset 0 0 10px rgba(255,179,71,0.2); }
.form.triangle { color: var(--triangle); border-color: var(--triangle); box-shadow: inset 0 0 10px rgba(255,107,107,0.2); }
.form.square { color: var(--square); border-color: var(--square); box-shadow: inset 0 0 10px rgba(94,196,255,0.2); }

.form.initial::after {
  content: '★'; position: absolute; top: -5px; right: -5px;
  font-size: 0.5em; color: #fff; text-shadow: 0 0 5px #fff;
}

/* Guide & Log */
.guide {
  max-width: 1300px; margin: 0 auto 16px; padding: 12px 20px;
  background: rgba(0, 255, 204, 0.05); border: 1px solid rgba(0, 255, 204, 0.2);
  border-left: 4px solid var(--accent); border-radius: 8px; display: flex; align-items: center; gap: 16px;
}
.log {
  max-width: 1300px; margin: 0 auto; padding: 12px 16px;
  background: #020408; border: 1px solid var(--border); border-radius: 8px;
  height: 140px; overflow-y: auto; font-family: Consolas, monospace; font-size: 0.8em;
}
.log-entry { margin-bottom: 4px; }
.log-entry.ok { color: var(--ok); }
.log-entry.err { color: var(--err); }
.log-entry.warn { color: var(--warn); }
.log-entry.info { color: var(--accent); }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn active" data-mode="0" onclick="newGame('0')">0 Doublon</button>
  <button class="btn" data-mode="1" onclick="newGame('1')">1 Doublon</button>
  <button class="btn" data-mode="3" onclick="newGame('3')">3 Doublons</button>
  <button class="btn" onclick="undo()">↶ Annuler</button>
</div>

<div class="guide" id="guide">
  <span class="phase-tag" style="background:var(--accent);color:#000;padding:2px 8px;border-radius:4px;font-weight:bold;font-size:0.8em;">INFO</span>
  <span id="guideText">Glissez une forme vers les statues pour l'envoyer dans la salle correspondante.</span>
</div>

<div class="rooms-grid" id="rooms"></div>

<div class="log" id="log"></div>

<script>
const FORMS = ['circle', 'triangle', 'square'];
const SYMBOL = { circle: '●', triangle: '▲', square: '■' };
const NAME = { circle: 'Cercle', triangle: 'Triangle', square: 'Carré' };

let state = null;
let history = [];
let formCounter = 0;
let dragInfo = null;
let activeRoom = 'circle';
let statueOrder = [...FORMS]; 

function newGame(mode) {
  document.querySelectorAll('.toolbar .btn[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  formCounter = 0;
  const config = generateConfig(mode);
  
  if (Math.random() < 0.3) {
    statueOrder = [...FORMS].sort(() => Math.random() - 0.5);
  } else {
    statueOrder = ['circle', 'triangle', 'square'];
  }

  state = { mode: mode, rooms: {}, log: [], allInitialForms: [], hasWon: false };
  for (const r of FORMS) {
    const wallForms = config[r].map(t => {
      const f = makeForm(t, r);
      state.allInitialForms.push(f); // On garde une trace de TOUTES les formes initiales
      return f;
    });
    
    state.rooms[r] = {
      wall: wallForms,
      inventory: [],
      doubled: config[r][0] === r && config[r][1] === r
    };
  }
  history = [];
  activeRoom = FORMS[0];

  let modeText = mode === '0' ? '0 Doublon' : mode === '1' ? '1 Doublon' : '3 Doublons';
  log('info', `━━ Nouvelle simulation — ${modeText} ━━`);
  log('dim', `Ordre des statues : ${statueOrder.map(t => NAME[t]).join(' | ')}`);
  render();
}

function makeForm(type, originRoom) {
  return { id: ++formCounter, type, originRoom, hasLeft: false, isInitial: true };
}

function generateConfig(mode) {
  const c = {};
  if (mode === '0') {
    if (Math.random() < 0.5) {
      c.circle = ['circle', 'triangle']; c.triangle = ['triangle', 'square']; c.square = ['square', 'circle'];
    } else {
      c.circle = ['circle', 'square']; c.triangle = ['triangle', 'circle']; c.square = ['square', 'triangle'];
    }
  } else if (mode === '1') {
    const d = FORMS[Math.floor(Math.random() * 3)];
    const [a, b] = FORMS.filter(f => f !== d);
    c[d] = [d, d]; c[a] = [a, b]; c[b] = [b, a];
  } else {
    for (const f of FORMS) c[f] = [f, f];
  }
  return c;
}

function render() {
  if (!state) return;
  document.getElementById('rooms').innerHTML = FORMS.map(renderRoomHUD).join('');
  renderGuide();
  renderLog();
  checkAutoWin();
}

function renderRoomHUD(r) {
  const room = state.rooms[r];
  const solved = isSolved(room, r);
  const isActive = (r === activeRoom);
  
  const totalForms = room.wall.length + room.inventory.length;
  const isOver = totalForms > 3;

  const formHtml = (f, loc) => `
    <div class="form ${f.type} ${f.isInitial ? 'initial' : ''}"
         draggable="true" data-form-id="${f.id}"
         data-room="${r}" data-location="${loc}"
         title="${NAME[f.type]}">${SYMBOL[f.type]}</div>`;

  const statuesHtml = statueOrder.map((type, index) => {
    let posLabel = index === 0 ? 'Gauche' : index === 1 ? 'Milieu' : 'Droite';
    return `
      <div class="statue ${type}" data-target="${type}" title="Envoyer à ${NAME[type]}">
        <div class="statue-symbol">${SYMBOL[type]}</div>
        <div class="statue-dest">${NAME[type]}</div>
        <span class="statue-label">${posLabel}</span>
      </div>`;
  }).join('');

  const combinedForms = [
    ...room.wall.map(f => ({ form: f, loc: 'wall' })),
    ...room.inventory.map(f => ({ form: f, loc: 'inventory' }))
  ];
  
  combinedForms.sort((a, b) => {
    return statueOrder.indexOf(a.form.type) - statueOrder.indexOf(b.form.type);
  });

  const allFormsHtml = combinedForms.map(item => formHtml(item.form, item.loc)).join('');

  return `
    <div class="room-hud ${room.doubled ? 'doubled' : ''} ${solved ? 'solved' : ''} ${isActive ? 'active-player' : ''} ${isOver ? 'over-capacity' : ''}" 
         data-room="${r}" onmouseenter="setActiveRoom('${r}')">
      
      ${solved ? '<div class="badge-solved">RÉSOLUE</div>' : ''}
      <div class="room-bg-shape">${SYMBOL[r]}</div>

      <div class="forms-area">
        <div class="hud-title" style="${isOver ? 'color:var(--err);' : ''}">
          Formes — ${NAME[r]} (${totalForms}/3)
          ${room.wall.length > 0 ? `<span class="wall-indicator">| Mur: ${room.wall.length}/2</span>` : ''}
        </div>
        <div class="forms-row">
          ${allFormsHtml || '<span style="color:var(--dim);font-size:0.8em;">Vide</span>'}
        </div>
      </div>

      <div class="statues-container">
        ${statuesHtml}
      </div>

    </div>`;
}

function setActiveRoom(r) {
  if (activeRoom !== r) {
    activeRoom = r;
    document.querySelectorAll('.room-hud').forEach(el => {
      el.classList.toggle('active-player', el.dataset.room === r);
    });
  }
}

/* 
  RÈGLE STRICTE DE VALIDATION :
  1. Le mur doit être totalement vide (wall.length === 0)
  2. L'inventaire doit contenir exactement 2 formes
  3. Les types doivent correspondre aux 2 formes différentes de la statue
  4. Toutes les formes initiales de cette salle doivent avoir quitté la salle (hasLeft === true)
*/
function isSolved(room, roomName) {
  if (room.wall.length > 0) return false;
  if (room.inventory.length !== 2) return false;
  
  const required = FORMS.filter(f => f !== roomName).sort();
  const types = room.inventory.map(f => f.type).sort();
  if (JSON.stringify(types) !== JSON.stringify(required)) return false;

  const roomInitials = state.allInitialForms.filter(f => f.originRoom === roomName);
  return roomInitials.every(f => f.hasLeft);
}

function checkAutoWin() {
  const allSolved = FORMS.every(r => isSolved(state.rooms[r], r));
  if (allSolved && !state.hasWon) {
    state.hasWon = true;
    log('ok', '══════════════════════════════');
    log('ok', '  ✓ SIMULATION RÉUSSIE !');
    log('ok', '══════════════════════════════');
  } else if (!allSolved) {
    state.hasWon = false;
  }
}

function renderGuide() {
  const text = document.getElementById('guideText');
  if (state.hasWon) {
    text.innerHTML = '<span style="color:var(--ok)">✓ Toutes les salles sont résolues !</span> Tu peux relancer une simulation.';
  } else {
    text.innerHTML = 'Glissez une forme sur une <b>Statue</b>. Toutes les formes du mur (★) doivent être envoyées.';
  }
}

function renderLog() {
  const el = document.getElementById('log');
  el.innerHTML = state.log.map(l => `<div class="log-entry ${l.type}">${l.msg}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function log(type, msg) { if (state) state.log.push({ type, msg }); }

const roomsEl = document.getElementById('rooms');

roomsEl.addEventListener('dragstart', e => {
  const form = e.target.closest('.form[draggable="true"]');
  if (!form) return;
  dragInfo = {
    formId: parseInt(form.dataset.formId),
    sourceRoom: form.dataset.room,
    sourceLocation: form.dataset.location
  };
  form.style.opacity = '0.3';
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', form.dataset.formId);
});

roomsEl.addEventListener('dragend', e => {
  if (e.target.classList) e.target.style.opacity = '1';
  document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
  dragInfo = null;
});

roomsEl.addEventListener('dragover', e => {
  const statue = e.target.closest('.statue');
  if (statue && dragInfo) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
    statue.classList.add('drop-hover');
  }
});

roomsEl.addEventListener('dragleave', e => {
  if (e.target.classList.contains('statue')) {
    e.target.classList.remove('drop-hover');
  }
});

roomsEl.addEventListener('drop', e => {
  const statue = e.target.closest('.statue');
  if (!statue || !dragInfo) return;
  e.preventDefault();
  handleSend(statue.dataset.target);
  document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
});

function handleSend(targetRoom) {
  if (!dragInfo) return;
  const { formId, sourceRoom, sourceLocation } = dragInfo;

  if (sourceRoom === targetRoom) {
    log('err', `✗ Impossible d'envoyer une forme vers sa propre salle.`);
    dragInfo = null;
    render();
    return;
  }

  const source = state.rooms[sourceRoom];
  const target = state.rooms[targetRoom];

  let form;
  if (sourceLocation === 'wall') {
    form = source.wall.find(f => f.id === formId);
  } else {
    form = source.inventory.find(f => f.id === formId);
  }
  if (!form) { dragInfo = null; return; }

  saveHistory();

  if (sourceLocation === 'wall') {
    source.wall = source.wall.filter(f => f.id !== formId);
  } else {
    source.inventory = source.inventory.filter(f => f.id !== formId);
  }

  // RÈGLE : On marque la forme comme ayant quitté sa salle d'origine
  if (targetRoom !== form.originRoom) form.hasLeft = true;
  target.inventory.push(form);

  const newTotal = target.wall.length + target.inventory.length;
  if (newTotal > 3) {
    log('warn', `⚠️ Dépassement : ${NAME[targetRoom]} a ${newTotal} formes (max 3).`);
  } else {
    log('ok', `${NAME[sourceRoom]} → ${NAME[targetRoom]} : ${NAME[form.type]}`);
  }
  
  dragInfo = null;
  render();
}

function saveHistory() {
  history.push(JSON.stringify({ rooms: state.rooms, log: state.log, formCounter, hasWon: state.hasWon }));
  if (history.length > 50) history.shift();
}

function undo() {
  if (history.length === 0) { log('warn', 'Rien à annuler.'); render(); return; }
  const p = JSON.parse(history.pop());
  state.rooms = p.rooms; state.log = p.log; formCounter = p.formCounter; state.hasWon = p.hasWon;
  log('info', '↶ Action annulée');
  render();
}

window.addEventListener('load', () => newGame('0'));
</script>

</body>
</html>
